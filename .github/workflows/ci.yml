name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # Both OSes matter: Linux catches case-sensitivity bugs Windows hides,
    # Windows catches the path quirks (long paths, cloud placeholders).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify FTS5 is available
        run: python -c "import sqlite3; c=sqlite3.connect(':memory:'); c.execute('CREATE VIRTUAL TABLE t USING fts5(b)'); print('fts5 ok', sqlite3.sqlite_version)"

      - name: Test
        run: pytest -q
